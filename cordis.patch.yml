# Bundle layer applied when this package is installed into a profile
# (Desktop: Plugins → Add plugin; CLI: `dsh plugin add`). It starts with no
# models: add your endpoints in Settings → RWKV Agent. `rwkv_agent` uses the model
# id `default`, which resolves to the first configured model.
- insert:
    - id: rwkv-llm
      name: dsh-rwkv-plugin
      config:
        providers: [rwkv]
        models: []

    - id: preset-rwkv
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rwkv
        name: RWKV Agent
        description: 专为 RWKV-7 G1 模型准备：默认容错编辑（edit）+ 历史思考留空 + 自动折叠上下文（Auto-Fold），并按配置支持切换 edit_lines 或状态化工单。
        order: 9
        plugins:
          # Same persona as the Standard preset.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          # Line-number edits (edit_lines) instead of literal old_string copy;
          # the RWKV catalog then hides `edit` (core/tools.ts buildCatalog).
          # Same plugin the headless / eval / teacher entry points mount.
          - id: rwkv-edit-lines
            name: dsh-rwkv-plugin/line-edit
          # Stateful work list (`todo_plan` / `todo_update`); hidden unless
          # `historyMode: worklist` is selected in settings.
          - id: rwkv-todo
            name: dsh-rwkv-plugin/todo
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    - id: tool-rwkv-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: rwkv_agent
        agentPreset: rwkv
        agentOptions:
          provider: rwkv
          model: default
