# Rows for a DSH source checkout. Put the `- insert:` block into the
# profile's own patch (~/.dsh/profiles/<profile>/cordis.patch.yml) and start
# with `pnpm dsh web`: the Settings → RWKV page saves into that file, and a
# `--patch` overlay would sit above it and shadow every save. Passing this
# file with --patch still works for a quick read-only try.
#
# It adds three rows:
#   rwkv-llm        the RWKV provider (route "rwkv"), selectable for any agent
#   preset-rwkv     the "RWKV Agent" preset: bash/fs/fs-search/web, Standard persona
#   tool-rwkv-agent a `rwkv_agent` delegation tool: the main (DeepSeek) agent
#                   hands a sub-task to an RWKV child running preset-rwkv
# To run RWKV as the main agent, pick model "RWKV · G1L 7.2B" and preset "RWKV Agent"
# in the Web UI (or uncomment the agent-default-model row at the bottom).

- insert:
    - id: rwkv-llm
      # Absolute file: URL. DSH names the row by this URL; a bare path makes
      # settings saves fail ("overridden by a home patch or command-line overlay").
      name: 'file:///Users/no22/Projects/dsh-rwkv-plugin/src/index.ts'
      config:
        providers: [rwkv]
        # agent-wire-think-v1.0 + agent-fast sampling, as in the current exams.
        thinking: full
        maxSteps: 12
        traceDir: '/Users/no22/Projects/dsh-rwkv-plugin/traces'
        models:
          - id: g1l-7.2b
            name: 'RWKV · G1L 7.2B'
            backend: irwkv
            baseURL: 'http://100.64.0.5:8103'
            model: rwkv7-g1l-7.2b
            contextWindow: 32768
          - id: g1l-13.3b
            name: 'RWKV · G1L 13.3B'
            backend: irwkv
            baseURL: 'http://100.64.0.5:8104'
            model: rwkv7-g1l-13.3b
            contextWindow: 32768
          - id: g1l-2.9b
            name: 'RWKV · G1L 2.9B'
            backend: irwkv
            baseURL: 'http://100.64.0.5:8102'
            model: rwkv7-g1l-2.9b
            contextWindow: 32768
          # rwkv_lightning CUDA + think-sft-mix NoRA (agent-wire-think-v2.0 history).
          # The adapter is uploaded from `file` when the server does not list
          # `id` (for example after a server restart).
          - id: g1l-7.2b-think-sft
            name: 'RWKV · G1L 7.2B + think-sft-mix'
            backend: lightning
            baseURL: 'http://100.64.0.9:8000'
            model: rwkv7-g1l-7.2b-20261031-ctx34304
            contextWindow: 32768
            historyEmptyThink: true
            adapter:
              id: think-sft-mix-g1l
              file: '/Users/no22/think-sft-mix-g1l.pth'
          # rwkv_lightning CUDA with an adapter: uploaded from `file` when the
          # server does not list `id` yet (re-uploaded after a server restart).
          # Point baseURL at a lightning server that runs the matching G1L base.
          # - id: g1l-7.2b-nora-v30
          #   name: 'RWKV · G1L 7.2B + NoRA v3.0'
          #   backend: lightning
          #   baseURL: 'http://100.64.0.8:8100'
          #   model: rwkv7-g1l-7.2b
          #   contextWindow: 32768
          #   adapter:
          #     id: nora-v30-r16-lr2e-5-e2
          #     file: '/Users/no22/Projects/RWKV-Agent/local/hf-upload/weights/rwkv7-g1l-7.2b-20261031-ctx34304/nora/v3.0/base-r16-lr2e-5-b8-e2/adapter-final.pth'

    - id: preset-rwkv
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rwkv
        name: RWKV Agent
        description: 'For RWKV-7 G1 models: bash, read/write/edit, glob/grep and web search/fetch under their DSH names, with the Standard system prompt minus the sections for tools, background jobs and surfaces this mode leaves out.'
        order: 9
        plugins:
          # Same persona as the Standard preset.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    - id: tool-rwkv-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: rwkv_agent
        agentPreset: rwkv
        agentOptions:
          provider: rwkv
          model: g1l-7.2b

