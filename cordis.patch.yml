# Bundle layer applied when this package is installed into a profile
# (Desktop: Plugins → Add plugin; CLI: `dsh plugin add`). It starts with no
# models: add your endpoints in Settings → RWKV Agent. `rwkv_agent` uses the model
# id `default`, which resolves to the first configured model.
- insert:
    - id: rwkv-llm
      name: dsh-rwkv-plugin
      config:
        providers: [rwkv]
        models: []

    - id: preset-rwkv
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rwkv
        name: RWKV Agent
        description: 专为 RWKV-7 G1 模型准备：只带终端、文件和网页 8 个工具，提示词精简自标准模式。
        order: 9
        plugins:
          # Same persona as the Standard preset.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          # Line-number edits (edit_lines) instead of literal old_string copy;
          # the RWKV catalog then hides `edit` (core/tools.ts buildCatalog).
          # Same plugin the headless / eval / teacher entry points mount.
          - id: rwkv-edit-lines
            name: dsh-rwkv-plugin/line-edit
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    - id: tool-rwkv-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: rwkv_agent
        agentPreset: rwkv
        agentOptions:
          provider: rwkv
          model: default
