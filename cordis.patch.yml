# Bundle layer applied when this package is installed into a profile
# (Desktop: Plugins → Add plugin; CLI: `dsh plugin add`). It starts with no
# models: add your endpoints in Settings → RWKV. `rwkv_agent` uses the model
# id `default`, which resolves to the first configured model.
- insert:
    - id: rwkv-llm
      name: dsh-rwkv-plugin
      config:
        providers: [rwkv]
        models: []

    - id: preset-rwkv
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rwkv
        name: RWKV
        description: Tools the RWKV agent was trained on (read/write/edit, list/search, bash, web).
        order: 9
        plugins:
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    - id: tool-rwkv-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: rwkv_agent
        agentPreset: rwkv
        agentOptions:
          provider: rwkv
          model: default
